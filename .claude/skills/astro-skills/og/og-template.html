<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500&family=Instrument+Serif:ital@1&family=Inter+Tight:wght@400;500&display=block" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; background: {{DARK}}; }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        color: #fff;
        background:
          radial-gradient(900px 700px at 105% 115%, {{ACCENT_GLOW}}, rgba(0, 0, 0, 0) 62%),
          radial-gradient(760px 520px at -8% -12%, {{MUTED_GLOW}}, rgba(0, 0, 0, 0) 66%),
          linear-gradient(180deg, {{DARK_TOP}} 0%, {{DARK}} 100%);
      }
      .grain {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 3px 3px;
        opacity: 0.5;
      }
      .frame {
        position: absolute;
        inset: 28px;
        border: 1px solid rgba(250, 252, 255, 0.16);
        border-radius: 40px;
      }
      .logo { position: absolute; left: 72px; top: 66px; height: 62px; width: auto; }
      .badge {
        position: absolute;
        left: 72px;
        top: 238px;
        font-family: 'Inter Tight', sans-serif;
        font-size: 20px;
        letter-spacing: 0.01em;
        color: rgba(255, 255, 255, 0.72);
      }
      h1 {
        position: absolute;
        left: 72px;
        top: 282px;
        font-family: 'Manrope', sans-serif;
        font-weight: 400;
        font-size: 84px;
        line-height: 1.08;
        letter-spacing: -0.03em;
      }
      h1 em {
        display: block;
        font-family: 'Instrument Serif', serif;
        font-style: italic;
        font-weight: 400;
        font-size: 96px;
        letter-spacing: -0.01em;
      }
      .foot {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 62px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: 'Inter Tight', sans-serif;
        font-size: 20px;
        color: rgba(255, 255, 255, 0.64);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        padding: 6px 8px 6px 24px;
        border-radius: 999px;
        background: rgba(250, 252, 255, 0.12);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), inset 0 8px 15px rgba(255, 255, 255, 0.1);
        color: #fff;
      }
      .pill i {
        display: grid;
        place-items: center;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: {{ACCENT}};
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="grain"></div>
      <div class="frame"></div>
      <img class="logo" src="{{LOGO}}" alt="" />
      <p class="badge">{{EYEBROW}}</p>
      <h1>{{TITLE}}<em>{{TITLE_ITALIC}}</em></h1>
      <div class="foot">
        <span>{{TAGLINE}}</span>
        <span class="pill"
          >{{CTA}}
          <i
            ><svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path
                d="M6 14 14 6M7 6h7v7"
                stroke="{{DARK}}"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round" /></svg
          ></i>
        </span>
      </div>
    </div>
  </body>
</html>
